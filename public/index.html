<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Skills Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #c2553d;
      --ink:    #1a1714;
      --mute:   #9b938a;
      --faint:  #c4bdb3;
      --bg:     #ffffff;
      --serif:  "Source Serif 4", Georgia, serif;
      --mono:   "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 88px 32px 120px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1.title {
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 22px;
    }

    #search {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 500;
      color: var(--mute);
      caret-color: var(--accent);
      padding: 0;
      margin-bottom: 56px;
    }
    #search::placeholder { color: var(--faint); opacity: 1; }

    #skills-list {
      display: flex;
      flex-direction: column;
      gap: 46px;
    }

    .skill-name {
      display: block;
      font-family: var(--serif);
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s;
      margin-bottom: 14px;
    }
    .skill-name:hover { color: var(--accent); }

    .skill-repo {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--faint);
      margin-left: 14px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .skill-description {
      font-size: 16.5px;
      line-height: 1.5;
      color: var(--mute);
      max-width: 440px;
      margin-bottom: 14px;
      text-wrap: pretty;
    }

    .install {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .install code {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
      overflow-wrap: anywhere;
      max-width: 440px;
    }

    .copy-btn {
      flex-shrink: 0;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--mute);
      transition: color 0.15s;
    }
    .copy-btn:hover { color: var(--ink); }
    .copy-btn.copied { color: var(--accent); }

    .empty-state {
      padding-top: 24px;
      color: var(--faint);
      font-size: 16px;
    }
  </style>
</head>
<body>

<main class="wrap">
  <p class="eyebrow" id="count">type to filter</p>
  <h1 class="title">Skills Registry</h1>
  <input
    type="search"
    id="search"
    placeholder="Search the registry"
    autocomplete="off"
    spellcheck="false"
  />
  <div id="skills-list"></div>
</main>

<script>
  let allSkills = [];

  async function loadSkills() {
    const res = await fetch('skills.json');
    if (!res.ok) throw new Error(`Failed to load skills.json: ${res.status}`);
    return res.json();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderSkill(skill) {
    return `
      <div class="skill">
        <a class="skill-name" href="${escapeHtml(skill.repoUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(skill.name)}<span class="skill-repo">${escapeHtml(skill.repo)}</span></a>
        <p class="skill-description">${escapeHtml(skill.description)}</p>
        <div class="install">
          <code>${escapeHtml(skill.installCommand)}</code>
          <button class="copy-btn" data-cmd="${escapeHtml(skill.installCommand)}">Copy</button>
        </div>
      </div>`;
  }

  function renderList(skills) {
    const list = document.getElementById('skills-list');
    const count = document.getElementById('count');

    if (skills.length === 0) {
      list.innerHTML = `<div class="empty-state">Nothing matches.</div>`;
      count.textContent = 'type to filter';
    } else {
      list.innerHTML = skills.map(renderSkill).join('');
      count.textContent = `${skills.length} skill${skills.length !== 1 ? 's' : ''} · type to filter`;
    }
  }

  function filterSkills(query) {
    if (!query.trim()) return allSkills;
    const q = query.toLowerCase();
    return allSkills.filter(
      (s) =>
        s.name.toLowerCase().includes(q) ||
        s.description.toLowerCase().includes(q) ||
        s.repo.toLowerCase().includes(q)
    );
  }

  document.getElementById('search').addEventListener('input', (e) => {
    renderList(filterSkills(e.target.value));
  });

  document.getElementById('skills-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    navigator.clipboard.writeText(btn.dataset.cmd).then(() => {
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  });

  loadSkills()
    .then((skills) => {
      allSkills = skills;
      renderList(allSkills);
    })
    .catch((err) => {
      document.getElementById('skills-list').innerHTML =
        `<div class="empty-state">Failed to load skills: ${escapeHtml(err.message)}</div>`;
    });
</script>
</body>
</html>
